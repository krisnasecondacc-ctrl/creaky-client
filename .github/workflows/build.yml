name: Build Creaky Client
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source
        run: unzip -q CreakyClient-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build mod
        working-directory: creaky-client
        run: gradle build --no-daemon
      - name: Download performance mods
        working-directory: creaky-client
        run: bash scripts/get-mods.sh pack
      - name: Assemble pack
        working-directory: creaky-client
        run: |
          find build/libs -name '*.jar' ! -name '*-sources.jar' -exec cp {} pack/mods/ \;
          cd pack && zip -r ../../CreakyClient-pack.zip .
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Creaky Client v1.0.${{ github.run_number }}
          files: CreakyClient-pack.zip
